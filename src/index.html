<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Island</title>
<meta name="description" content="A small island civilisation that lives on its own, and grows a little wiser whenever there's spare power.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root { --fg:#e8e8e8; --muted:#8a8f98; --line:#e8e8e8; --accent:#59f08b; --bad:#e0605a; --love:#e889b8; --food:#f2cd4c; --wood:#e07b45; --panel:rgba(2,4,9,.86); }
* { box-sizing:border-box; }
html,body { margin:0; height:100%; background:#04070d; color:var(--fg); font:14px/1.35 "Share Tech Mono", ui-monospace, monospace; }
#app { position:relative; width:100%; height:100vh; height:100dvh; overflow:hidden; }
#c { position:absolute; inset:0; display:block; cursor:crosshair; }
.panel { position:absolute; background:var(--panel); border:1px solid var(--line); padding:10px 12px; }
#top { position:absolute; top:12px; left:50%; transform:translateX(-50%); text-align:center; pointer-events:none; white-space:nowrap; }
#title { font-size:28px; letter-spacing:.06em; }
#when { color:var(--muted); margin-top:2px; }
.wx { color:var(--muted); } .wx.rain { color:#8fb4dc; } .wx.storm { color:#c7d3ff; } .wx.heat { color:#f2a54c; } .wx.cold { color:#9fd0ff; } .wx.snow { color:#f2f6fa; } .wx.fog { color:#c4ccd2; } .fest { color:var(--food); } .herb { color:#8fcf7e; }
.ic.herb { background:#6e5238; box-shadow:inset 0 3px 0 #8fcf7e, inset 2px 0 0 #6e9a58; }
.ic.rat { background:#6f6862; box-shadow:inset 0 -3px 0 #1a1a1a, inset -2px 0 0 #57514c; }
.ic.horn { background:#e9dcc0; box-shadow:inset 3px 3px 0 #04070d, inset -1px 0 0 #b8a27a; border-radius:0 0 0 6px; }
.ic.isle { background:#6fa3c8; box-shadow:inset 0 -3px 0 #8a5a32, inset 0 -4px 0 #04070d; }
.ic.goat { background:#ece6d6; box-shadow:inset 0 -2px 0 #2e2a26, inset -2px 0 0 #9a7a4e; } .goat { color:#e3d6b0; } .by { color:#d9c38a; }
.ic.by { background:transparent; box-shadow:inset 0 0 0 1px #d9c38a, inset 0 -3px 0 #d9c38a; }
#badge { display:inline-block; margin-top:6px; border:1px solid var(--muted); color:var(--muted); padding:1px 6px; font-size:12px; }
#res { left:12px; bottom:12px; min-width:190px; }
#res .row { display:flex; align-items:center; gap:8px; }
#res .row b { margin-left:auto; font-weight:normal; }
.ic { width:8px; height:8px; display:inline-block; }
.ic.pop { background:#d9d9d9; } .ic.food { background:var(--food); } .ic.wood { background:var(--wood); } .ic.house { background:#a8443a; } .ic.field { background:#6e4b2c; outline:1px solid #b59b5c; outline-offset:-3px; } .ic.gran { background:#d2b25a; outline:1px solid #8a5a32; outline-offset:-2px; } .ic.wild { background:#8a8d93; box-shadow:inset -2px -2px 0 #55585e; } .ic.path { background:#6f5a3e; box-shadow:inset 2px 0 0 #3d7a3a, inset -2px 0 0 #3d7a3a; } .ic.grave { background:#3d7a3a; box-shadow:inset 0 2px 0 #b8b8b0, inset 2px 0 0 #8d8a80, inset -2px 0 0 #8d8a80; } .ic.hunt { background:#a4825a; box-shadow:inset 0 -2px 0 #d0574a; }
#res .m { color:var(--muted); } #res .bad { color:var(--bad); }
.hd { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.12em; margin-bottom:6px; }
#chron { right:12px; bottom:12px; width:340px; max-height:46%; display:flex; flex-direction:column; }
#log { overflow:auto; scrollbar-width:thin; scrollbar-color:#333 transparent; }
#log div { padding:2px 0; border-bottom:1px dashed rgba(255,255,255,.07); }
#log .when { color:var(--muted); margin-right:8px; font-size:12px; }
#log .maj { color:var(--accent); } #log .bad { color:var(--bad); } #log .good { color:#cfe9d7; } #log .love { color:var(--love); } #log .m { color:var(--muted); }
#graph { right:12px; top:12px; width:220px; }
#spark { width:100%; height:48px; display:block; }
#sparkcap { color:var(--muted); font-size:11px; margin-top:4px; }
.btn { position:absolute; background:var(--panel); border:1px solid var(--line); color:var(--fg); font:inherit; padding:6px 12px; cursor:pointer; }
.btn:hover, .btn.on { border-color:var(--accent); color:var(--accent); }
#skybtn { left:12px; top:12px; }
#logbtn { display:none; }
#histbtn { left:12px; top:54px; }
#hist { position:absolute; inset:0; background:#03050a; overflow:auto; scrollbar-width:thin; scrollbar-color:#333 transparent; }
#histback { left:12px; top:12px; position:fixed; z-index:2; }
#hwrap { max-width:760px; margin:0 auto; padding:16px 16px 40px; }
#hhd { text-align:center; font-size:24px; margin-top:4px; }
#hsub { text-align:center; color:var(--muted); margin:4px 0 14px; }
#hchart { position:relative; padding:10px 12px; }
#hspark { width:100%; height:120px; display:block; }
#hcap { color:var(--muted); font-size:12px; margin-top:6px; display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; }
.yr { border-left:1px solid rgba(255,255,255,.25); margin:18px 0 0 6px; padding:0 0 0 14px; position:relative; }
.yr::before { content:""; position:absolute; left:-5px; top:5px; width:9px; height:9px; background:#04070d; border:1px solid var(--fg); transform:rotate(45deg); }
.yr.now::before { border-color:var(--accent); background:var(--accent); }
.yr .yh { display:flex; flex-wrap:wrap; gap:4px 12px; align-items:baseline; }
.yr .yh b { font-weight:normal; font-size:17px; }
.yr.now .yh b { color:var(--accent); }
.yr .rd { color:var(--muted); font-size:12px; }
.yr .ys { color:var(--muted); margin:3px 0 5px; font-size:13px; }
.yr .ys .up { color:var(--accent); } .yr .ys .dn { color:var(--bad); }
.yr .ev { padding:2px 0; font-size:13px; }
.yr .ev .se { color:var(--muted); display:inline-block; width:62px; font-size:12px; }
.yr .quiet { color:var(--muted); font-size:13px; }
#sky { position:absolute; inset:0; background:#020308; }
#skyc { width:100%; height:100%; display:block; }
#skyhd { position:absolute; top:14px; left:0; right:0; text-align:center; font-size:24px; pointer-events:none; }
#skytip { position:absolute; bottom:20px; left:50%; transform:translateX(-50%); width:min(560px, calc(100% - 32px)); text-align:center; border:1px solid var(--line); background:var(--panel); padding:10px 14px; }
#sky .btn { left:12px; top:12px; }
#tl { right:12px; top:12px; width:320px; max-height:calc(100% - 140px); display:flex; flex-direction:column; }
#tlog { overflow:auto; scrollbar-width:thin; scrollbar-color:#333 transparent; }
#tlog div { padding:3px 0; border-bottom:1px dashed rgba(255,255,255,.07); }
#tlog .when { display:block; color:var(--muted); font-size:12px; }
#skytip .m { color:var(--muted); margin-top:4px; font-size:12px; }
#tip { position:absolute; background:var(--panel); border:1px solid var(--line); padding:6px 9px; pointer-events:none; font-size:13px; }
#tip .m { color:var(--muted); }
#catch { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); border:1px solid var(--accent); color:var(--accent); background:var(--panel); padding:10px 16px; }
#who { left:12px; top:56px; width:270px; max-height:calc(100% - 330px); overflow:auto; scrollbar-width:thin; font-size:13px; }
#who .hd { display:flex; } #who .x { margin-left:auto; cursor:pointer; color:var(--fg); }
#who .x:hover, #who a:hover { color:var(--accent); }
#who b { font-weight:normal; font-size:15px; color:var(--accent); }
#who .m { color:var(--muted); } #who .bad { color:var(--bad); }
#who .do { margin:2px 0 6px; }
#who .kin { padding:1px 0; }
#who a { color:var(--fg); text-decoration:underline dotted; text-underline-offset:3px; cursor:pointer; }
#who .ev { margin-top:6px; padding-top:4px; border-top:1px dashed rgba(255,255,255,.12); color:#cfd3d8; }
#who .when { color:var(--muted); margin-right:6px; font-size:11px; }
[hidden] { display:none !important; }
@media (max-width: 760px) {
  #title { font-size:22px; } #top { top:8px; }
  #graph { display:none; }
  #res { left:8px; bottom:8px; min-width:0; font-size:13px; padding:8px 10px; }
  #skybtn { left:8px; top:auto; bottom:8px; right:auto; transform:translateY(-160px); }
  #logbtn { display:block; right:8px; bottom:8px; }
  #who { left:8px; right:8px; top:64px; width:auto; max-height:34%; font-size:12px; }
  #chron { display:none; right:8px; left:8px; width:auto; bottom:52px; max-height:55%; }
  #app.logopen #chron { display:flex; }
  #histbtn { left:8px; top:auto; bottom:8px; transform:translateY(-200px); }
  #hwrap { padding-top:54px; }
  .yr .ev .se { width:auto; margin-right:8px; }
  #tl { top:52px; left:8px; right:8px; width:auto; max-height:30%; }
}
</style>
</head>
<body>
<div id="app">
  <canvas id="c"></canvas>
  <div id="top"><div id="title">…</div><div id="when"></div><div id="badge" hidden>demo · fast-forwarded world</div></div>
  <button class="btn" id="skybtn">✦ Sky</button>
  <button class="btn" id="histbtn">≡ History</button>
  <div class="panel" id="res"></div>
  <div class="panel" id="graph"><canvas id="spark"></canvas><div id="sparkcap"></div></div>
  <div class="panel" id="chron"><div class="hd">Chronicle</div><div id="log"></div></div>
  <button class="btn" id="logbtn">Chronicle</button>
  <div class="panel" id="who" hidden></div>
  <div id="tip" hidden></div>
  <div id="catch" hidden></div>
  <div id="hist" hidden>
    <button class="btn" id="histback">← Island</button>
    <div id="hwrap">
      <div id="hhd"></div>
      <div id="hsub"></div>
      <div class="panel" id="hchart"><canvas id="hspark"></canvas><div id="hcap"></div></div>
      <div id="hyears"></div>
    </div>
  </div>
  <div id="sky" hidden>
    <canvas id="skyc"></canvas>
    <div id="skyhd">Discoveries</div>
    <button class="btn" onclick="document.getElementById('skybtn').click()">← Island</button>
    <div class="panel" id="tl"><div class="hd" id="tlhd">Changes to the island</div><div id="tlog"></div></div>
    <div id="skytip">Each star is something the islanders have learned. New stars appear when spare power reaches the island.</div>
  </div>
</div>
<!--SCRIPT-->
</body>
</html>
